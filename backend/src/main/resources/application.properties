micronaut.application.name=community-map-api

# Every value below can be overridden with an environment variable.
# The defaults match the local setup (docker-compose.yml + Vite dev server).
micronaut.server.port=${PORT:8080}

datasources.default.url=${DATASOURCE_URL:`jdbc:postgresql://localhost:5433/community_map`}
datasources.default.username=${DATASOURCE_USERNAME:community_map}
datasources.default.password=${DATASOURCE_PASSWORD:community_map}
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
# Small pool that releases idle connections, so a serverless Postgres
# (Neon) is free to suspend when nobody is using the app.
datasources.default.maximum-pool-size=${DATASOURCE_POOL_SIZE:5}
datasources.default.minimum-idle=0
datasources.default.idle-timeout=120000

flyway.datasources.default.enabled=true

micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins=${CORS_ALLOWED_ORIGINS:`http://localhost:5173`}
micronaut.server.cors.configurations.web.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
micronaut.server.cors.configurations.web.allowed-headers=Content-Type,Authorization

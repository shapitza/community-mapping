# Render blueprint: one free Docker web service for the API and one free
# static site for the frontend. The database lives on Neon.
# See docs/deployment.md for the step-by-step setup.
services:
  - type: web
    name: community-map-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATASOURCE_URL
        sync: false # jdbc:postgresql://<neon-host>/<database>?sslmode=require
      - key: DATASOURCE_USERNAME
        sync: false
      - key: DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # URL of the static site below, without a trailing slash

  - type: web
    name: community-map-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false # https://<api-service>.onrender.com/api
    routes:
      # Single-page app: every path is served by index.html.
      - type: rewrite
        source: /*
        destination: /index.html
